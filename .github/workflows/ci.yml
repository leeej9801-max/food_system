name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: tee 뒤에서도 실패가 전달된다

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: rls
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d rls"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 일회용 CI DB. 매장 격리(RLS) 테스트는 이 값이 없으면 skip된다
      RLS_TEST_DATABASE_URL: postgresql+psycopg://owner:ci-only@localhost:5432/rls
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - name: Tests (SQLite API + PostgreSQL 격리, skip 금지)
        run: |
          uv run pytest -ra | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q " skipped" "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::skip된 테스트가 있다. 격리 테스트는 CI에서 반드시 실행돼야 한다"
            exit 1
          fi
      - name: 배포 requirements가 uv.lock과 일치
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -q --output-file "$RUNNER_TEMP/req.txt"
          diff <(tail -n +3 "$RUNNER_TEMP/req.txt") <(tail -n +3 requirements.deploy.txt)
      - run: docker build -t food-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # frontend/Dockerfile과 같은 메이저
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
