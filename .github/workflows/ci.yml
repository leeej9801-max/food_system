name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: tee 뒤에서도 실패가 전달된다

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: rls
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d rls"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 일회용 CI DB. 없으면 테스트가 시작하지 않는다 (tests/conftest.py)
      RLS_TEST_DATABASE_URL: postgresql+psycopg://owner:ci-only@localhost:5432/rls
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - name: 마이그레이션 적용 + 모델과 DB 일치 (DB-002)
        env:
          DATABASE_URL: postgresql+psycopg://owner:ci-only@localhost:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (전부 PostgreSQL + 런타임 역할, skip 금지)
        run: |
          uv run pytest -ra | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q " skipped" "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::skip된 테스트가 있다. 격리 테스트는 CI에서 반드시 실행돼야 한다"
            exit 1
          fi
      - name: 배포 requirements가 uv.lock과 일치
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -q --output-file "$RUNNER_TEMP/req.txt"
          diff <(tail -n +3 "$RUNNER_TEMP/req.txt") <(tail -n +3 requirements.deploy.txt)
      - run: docker build -t food-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # frontend/Dockerfile과 같은 메이저
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks가 전체 이력을 본다
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 예외는 .github/security-allowlist.md에 근거와 함께 적는다
      - name: 의존성 취약점 (backend, 배포 대상만)
        run: uvx pip-audit@2.9.0 -r backend/requirements.deploy.txt --require-hashes --disable-pip
      - name: 의존성 취약점 (frontend, 배포 대상만, high 이상)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: 시크릿 유출 (전체 이력)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
