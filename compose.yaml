name: food

x-api-env: &api-env
  APP_ENV: production
  API_PREFIX: /api/v1
  APP_TIMEZONE: Asia/Seoul
  CORS_ALLOWED_ORIGINS: https://lci.leejblab.site

x-api: &api
  image: food-backend:local
  build: ./backend
  networks: [private]

services:
  food-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_DB: food
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U food -d food']
      interval: 5s
      timeout: 5s
      retries: 20

  # 소유자(food) 계정: 마이그레이션 + 런타임 계정 생성·권한 (ADR-013). 일회성 import_sqlite도 이 서비스로 실행한다.
  migrate:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+psycopg://food:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}@food-db:5432/food
      RUNTIME_DB_USER: food_app
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run backend/scripts/prepare_deployment.py to add RUNTIME_DB_PASSWORD}
    command: [sh, -c, 'alembic upgrade head && python -m scripts.ensure_runtime_role']
    depends_on:
      food-db:
        condition: service_healthy

  # 런타임(food_app) 계정: 소유자·슈퍼유저가 아니므로 매장 RLS가 항상 적용된다
  backend:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+psycopg://food_app:${RUNTIME_DB_PASSWORD:?Run backend/scripts/prepare_deployment.py to add RUNTIME_DB_PASSWORD}@food-db:5432/food
    restart: unless-stopped
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --root-path, /food]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: food-web:local
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FOOD_PORT:-8088}:80'
    networks:
      private:
      tunnel:
        aliases: [food-web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/food/health']
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  private:
    internal: true
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-lci-prod_edge}

volumes:
  pgdata:
