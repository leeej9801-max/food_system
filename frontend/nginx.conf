server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /food { return 308 /food/$is_args$args; }

    # Docker DNS is resolved on each upstream reconnection after API replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $food_api http://backend:8000;

    location = /food/health {
        proxy_pass $food_api/health;
        add_header Cache-Control no-store always;
    }

    location ^~ /food/api/ {
        rewrite ^/food(/api/.*)$ $1 break;
        proxy_pass $food_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control no-store always;
    }

    location /food/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /food/ {
        try_files $uri $uri/ /food/index.html;
        add_header Cache-Control no-store always;
    }

    location / { return 404; }
}
