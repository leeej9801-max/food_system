map "$host:$request_uri" $food_legacy_redirect {
    default "";
    ~^lci\.leejblab\.site:/food(?<food_legacy_path>/.*)$ https://food.leejblab.site$food_legacy_path;
    ~^lci\.leejblab\.site:/food(?<food_legacy_query>\?.*)?$ https://food.leejblab.site/$food_legacy_query;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Use the original URI so escaped paths and query strings survive the move.
    if ($food_legacy_redirect) { return 301 $food_legacy_redirect; }

    # Docker DNS is resolved on each upstream reconnection after API replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $food_api http://backend:8000;

    location = /health {
        proxy_pass $food_api/health;
        add_header Cache-Control no-store always;
    }

    location ^~ /api/ {
        proxy_pass $food_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control no-store always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store always;
    }
}
